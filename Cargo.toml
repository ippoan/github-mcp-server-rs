[package]
name = "github-mcp-server-rs"
version = "0.1.0"
edition = "2021"
description = "GitHub MCP server with auth-worker Device Authorization Grant (RFC 8628) client"
license = "MIT"
repository = "https://github.com/ippoan/github-mcp-server-rs"

[[bin]]
name = "github-mcp-server-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1.2.1"
rmcp = { version = "1.6.0", features = ["server", "transport-streamable-http-server", "macros", "schemars", "server-side-http"] }
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
# WS relay (issue #27): outbound WS client to auth-worker mcp.ippoan.org.
# `handshake` is also needed by tests/relay_smoke.rs (mock server side).
# `rustls-tls-native-roots` reads the OS trust store (e.g. `/etc/ssl/certs/`),
# so MITM-inspected egress environments (Anthropic Code-on-Web sandbox CA,
# corporate proxies) work without binary rebuilds. webpki-roots embeds a
# compile-time Mozilla list and ignores SSL_CERT_FILE / system store, which
# breaks device-flow auth from those environments.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"

[dev-dependencies]
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util", "io-util", "net", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
