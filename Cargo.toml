[package]
name = "github-mcp-server-rs"
version = "0.1.0"
edition = "2021"
description = "GitHub MCP server with auth-worker Device Authorization Grant (RFC 8628) client"
license = "MIT"
repository = "https://github.com/ippoan/github-mcp-server-rs"

[[bin]]
name = "github-mcp-server-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
