name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # tag push (v*) は release.yml が build + release を兼ねるので CI 再走させない

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/rust-ci.yml@main
    with:
      binary_name: github-mcp-server-rs
      shared_key: github-mcp-server-rs
      build_secret_env_name: MCP_INTERNAL_SECRET
      # secret 登録済み repo (= ippoan/github-mcp-server-rs main) で
      # 想定外に dev fallback (21 chars = "dev-secret-do-not-use") に落ちて
      # いないか早期検知 (#25)。fork PR は secret 不可視で 21 chars になるので
      # main への push のみで判定 (reusable 側で gating 済)。
      extra_smoke_test: |
        OUTPUT="$(./target/release/"$BINARY" doctor)"
        echo "$OUTPUT"
        LEN="$(echo "$OUTPUT" | grep -oP 'internal_secret:\s+\(set,\s+\K\d+' || true)"
        if [ -z "$LEN" ]; then
          echo "::error::doctor 出力から internal_secret length を抽出できなかった" >&2
          exit 1
        fi
        if [ "$LEN" = "21" ]; then
          echo "::error::internal_secret が 21 chars = dev fallback。MCP_INTERNAL_SECRET が repo secret に未登録か空の可能性。tag を切る前に確認すること (#25)。" >&2
          exit 1
        fi
        echo "OK: internal_secret embed length=$LEN (not dev fallback)"
    secrets:
      BUILD_SECRET: ${{ secrets.MCP_INTERNAL_SECRET }}

  # ippoan/mcp-relay-rs の最新 `dev-N` tag に追従しているか確認。
  # 古い `dev-N` に張り付いてると Step Summary + `::warning::` で通知される。
  # warn-only (fail させない) なので auto-merge は止めない。
  check-mcp-relay:
    name: mcp-relay version check
    uses: ippoan/ci-workflows/.github/workflows/check-dep-version.yml@main
    with:
      dep_name: mcp-relay
      dep_repo: ippoan/mcp-relay-rs
      tag_prefix: 'dev-'

  auto-merge:
    name: Auto Merge
    needs: [ci]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.ci.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # PAT で merge することで merge commit が PAT user 作者になり、main push
      # event が普通に他 workflow を trigger できる ("GITHUB_TOKEN events don't
      # fire workflows" の制約回避)。これで `dev-release.yml` が auto 発火する
      # ようになる (今まで `dev-N` tag が一度も無かった理由)。
      AUTO_MERGE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
