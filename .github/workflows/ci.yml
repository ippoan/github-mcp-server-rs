name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # tag push (v*) は release.yml が build + release を兼ねるので CI 再走させない

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # sccache: GHA backend で rustc コンパイル成果物を cache。
  # release.yml (rust-binary-release reusable) と同じ shared-key で
  # ~/.cargo/registry も共有する。
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: github-mcp-server-rs
          cache-targets: false
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: sccache --show-stats

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: github-mcp-server-rs
          cache-targets: false
      - run: cargo test --all-features --no-fail-fast
      - run: sccache --show-stats

  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: github-mcp-server-rs
          cache-targets: false
      - run: cargo build --release --locked
      - run: sccache --show-stats
      - name: Smoke test (CLI --help)
        run: ./target/release/github-mcp-server-rs --help
      - uses: actions/upload-artifact@v4
        with:
          name: github-mcp-server-rs-linux-x86_64
          path: target/release/github-mcp-server-rs
          if-no-files-found: error
          retention-days: 14
