name: Release

# tag push (v*) 起点で ippoan/ci-workflows の rust-binary-release reusable を呼び、
# GitHub Release を作成 + バイナリを attach する。
#
# 初回 tag: `gh workflow run tag-release.yml -R ippoan/github-mcp-server-rs` か
#          `git tag v0.1.0 && git push origin v0.1.0` で起動。
# tag に `-` 含まれていたら自動 prerelease (例: v0.2.0-rc1)。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: ippoan/ci-workflows/.github/workflows/rust-binary-release.yml@main
    with:
      bin_name: github-mcp-server-rs
      # reusable の default が linux x86_64 のみ (object schema)。
      # macOS / Windows / aarch64 が要るようになったら下記で明示:
      #   targets: |
      #     [
      #       {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","archive":"tar.gz"},
      #       {"target":"x86_64-apple-darwin","os":"macos-latest","archive":"tar.gz"},
      #       {"target":"aarch64-apple-darwin","os":"macos-latest","archive":"tar.gz"},
      #       {"target":"x86_64-pc-windows-msvc","os":"windows-latest","archive":"zip","ext":".exe"}
      #     ]
    permissions:
      contents: write
    secrets:
      # build.rs が読んで release binary に embed する quasi-public な auth-worker
      # introspect secret (#25)。repo secret として登録されていない場合は空文字列
      # として渡り、binary 側は dev fallback ("dev-secret-do-not-use") に落ちる。
      MCP_INTERNAL_SECRET: ${{ secrets.MCP_INTERNAL_SECRET }}
